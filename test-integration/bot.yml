---
- params:
    minecraft_npc: ../../../../../bin/minecraft-npc.js
    base: ../../../../..

- description: Set up Minecraft NPC environment
  command: 'make -f {base}/test-integration/fixtures/Makefile install-minecraft-npc'
  exitcode: 0
  output: 'added .* package.*'

- description: Start Minecraft server via container using Docker Compose
  command: 'make -f {base}/test-integration/fixtures/Makefile start-minecraft-server'
  exitcode: 0

- description: Allow Minecraft server to start
  command: 'sleep 120'
  exitcode: 0

- description: Prepare initial staged config file from examples config file
  command: 'cp {base}/examples/minecraft-npc.yaml {base}/stage/minecraft-npc.yaml'
  exitcode: 0

- description: Set Minecraft server IP address in staged config file
  command: 'sed -i "s/localhost/$(make --no-print-directory -f {base}/test-integration/fixtures/Makefile get-minecraft-server-ip-address | xargs)/g" {base}/stage/minecraft-npc.yaml'
  exitcode: 0

- description: Run Minecraft NPC, check it's starting
  command: '{minecraft_npc} start --conf-file {base}/stage/minecraft-npc.yaml'
  exitcode: 1
  output: '.*Starting Minecraft NPC.*'

- description: Allow Minecraft test to run and complete
  command: 'sleep 120'
  exitcode: 0

- description: Stop Minecraft server and remove container
  command: 'make -f {base}/test-integration/fixtures/Makefile stop-minecraft-server'
  exitcode: 0
  output: 'docker rm.*'
