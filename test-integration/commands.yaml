- params:
    minecraft_npc: ../../../../../bin/minecraft-npc.js

- description: Command help should display help information
  command: '{minecraft_npc} --help'
  exitcode: 0
  output: 'Usage: minecraft-npc'

- description: Command start with unspecified config file should result in error
  command: '{minecraft_npc} start --conf-file'
  exitcode: 1
  output: 'argument missing'
